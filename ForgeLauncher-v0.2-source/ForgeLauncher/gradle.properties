# Conservative settings for laptops with about 6 GB RAM.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Built-in Kotlin in AGP 9.4 currently produced stale duplicate Compose symbols
# during incremental rebuilds in validation. Full Kotlin compilation is more
# reliable for this small beginner project and still completes quickly.
kotlin.incremental=false
